        <p>BurstWatch is a real-time meteorological intelligence platform monitoring 419+ Indian cities and high-risk corridors across the Himalayas, Western Ghats, Northeast India, and coastal zones.</p>
        <h2>Core Weather Intelligence Layers</h2>
        <ul>
          <li><strong>Cloudburst Risk Prediction:</strong> Physics-informed machine learning scoring for extreme convective rainfall and flash-flood risk.</li>

          <li><strong>Global Air Quality (AQI):</strong> Continuous thermodynamic AQI dispersion maps and station telemetry.</li>
