services:
  - type: web
    name: burstwatch-ml-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: RUN_ON_STARTUP
        value: "true"
      - key: ALLOW_SKLEARN_MISMATCH
        value: "true"
